<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ντίνος Χριστιανόπουλος — ψηφιακό αρχείο τεκμηρίων</title>
<meta name="description" content="Ψηφιακό αρχείο τεκμηρίων για τον Ντίνο Χριστιανόπουλο (1931–2020). Ανεξάρτητη πρωτοβουλία, υπό κατασκευή.">
<style>
@font-face{font-family:"EB Garamond";src:url(fonts/ebgaramond-regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"EB Garamond";src:url(fonts/ebgaramond-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"EB Garamond";src:url(fonts/ebgaramond-semibold.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{--ochre:#EDC89B;--blue:#0033A0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ochre);color:var(--blue)}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:2rem 1.25rem;
font-family:"EB Garamond",Garamond,"Times New Roman",serif;text-align:center;-webkit-font-smoothing:antialiased}
main{max-width:34rem}
h1{margin:0;font-weight:600;font-size:clamp(2rem,1.4rem + 3vw,3.2rem);line-height:1.1}
.years{margin:.4rem 0 0;font-size:1.25rem;font-variant-numeric:lining-nums}
.rule{width:3rem;height:1px;background:var(--blue);margin:2rem auto;opacity:.5}
.what{margin:0;font-size:1.3rem;line-height:1.5}
.soon{margin:.6rem 0 0;font-style:italic;font-size:1.1rem}
.note{margin:2.4rem 0 0;font-size:.95rem;font-style:italic;opacity:.8}
</style>
</head>
<body>
<main>
<h1>Ντίνος Χριστιανόπουλος</h1>
<p class="years">1931–2020</p>
<div class="rule" aria-hidden="true"></div>
<p class="what">Ψηφιακό αρχείο τεκμηρίων</p>
<p class="soon">υπό κατασκευή</p>
<p class="note">Ανεξάρτητη πρωτοβουλία</p>
</main>
</body>
</html>
